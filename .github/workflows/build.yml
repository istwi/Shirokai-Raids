name: Builds de desenvolvimento
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e executar testes
        shell: bash
        run: bash ./gradlew --no-daemon build
      - name: Auditar simulador oficial Cobblemon 1.8.3
        shell: bash
        run: python scripts/run_showdown_audit.py
      - name: Verificar JAR e gerar checksum
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          python scripts/verify_jar.py --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: shirokai-raids-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/libs/Shirokai-Raids-*-fabric-1.21.1.jar
            build/libs/SHA256SUMS
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-${{ matrix.os }}
          path: build/reports/tests/
