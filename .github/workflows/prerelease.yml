name: Publicar pre-release de desenvolvimento
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID de um build da main concluído com sucesso'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: development-prerelease
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Conferir origem e resultado do build
        id: source
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const id = process.env.RUN_ID;
            if (!/^[1-9][0-9]*$/.test(id)) throw new Error('ID de execução inválido');
            const run = (await github.rest.actions.getWorkflowRun({owner:context.repo.owner, repo:context.repo.repo, run_id:Number(id)})).data;
            if (run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main'
                || run.path !== '.github/workflows/build.yml' || run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Selecione um build de desenvolvimento bem-sucedido da main deste repositório');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run_url', run.html_url);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: shirokai-raids-ubuntu-latest-${{ steps.source.outputs.sha }}
          path: build/libs
      - name: Validar checksum original, versão dev e JAR
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, re, zipfile, json
          from pathlib import Path
          folder = Path('build/libs')
          jars = list(folder.glob('*.jar'))
          assert len(jars) == 1, 'Artefato deve conter um único JAR'
          jar = jars[0]
          with zipfile.ZipFile(jar) as z:
              metadata = json.loads(z.read('fabric.mod.json'))
          version = metadata['version']
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-dev', version), 'Somente versões -dev'
          expected = f'Shirokai-Raids-{version}-fabric-1.21.1.jar'
          assert jar.name == expected
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert (folder/'SHA256SUMS').read_text().strip() == f'{digest}  {expected}', 'Checksum do build original diverge'
          props = dict(line.split('=',1) for line in Path('gradle.properties').read_text().splitlines() if '=' in line)
          assert props['mod_version'] == version, 'Artefato não corresponde ao commit selecionado'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          python scripts/verify_jar.py --version "$version"
      - name: Anexar arquivos e publicar como pre-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_URL: ${{ steps.source.outputs.run_url }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const base = {owner:context.repo.owner, repo:context.repo.repo};
            const version = process.env.VERSION;
            const sha = process.env.SOURCE_SHA;
            const tag = `dev-${version.slice(0, -4)}`;
            let ref;
            try { ref = (await github.rest.git.getRef({...base, ref:`tags/${tag}`})).data.object; }
            catch (e) { if (e.status !== 404) throw e; }
            if (ref && (ref.type !== 'commit' || ref.sha !== sha)) throw new Error('Tag já existe em outro commit; não será movida');
            if (!ref) await github.rest.git.createRef({...base, ref:`refs/tags/${tag}`, sha});
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...base, tag})).data; }
            catch (e) { if (e.status !== 404) throw e; }
            const body = `Pré-release de desenvolvimento **${version}**, instável e destinada a testes.\n\n` +
              `Compatibilidade: Minecraft 1.21.1, Fabric e Cobblemon 1.8.3; Java 21. Instalação somente no servidor.\n\n` +
              `Commit: ${sha}\nBuild validado: ${process.env.RUN_URL}\n\n` +
              `Baixe o JAR e confira SHA256SUMS. Faça backup do mundo/configurações antes de atualizar.\n\n` +
              `Não há aceite com clientes reais nem capacidade comprovada para 100 pessoas.\n\n` +
              `[Histórico de alterações](https://github.com/${base.owner}/${base.repo}/blob/${sha}/CHANGELOG.md) · ` +
              `[Validação e limitações](https://github.com/${base.owner}/${base.repo}/blob/${sha}/docs/VALIDACAO_${version}.md)`;
            if (!release) release = (await github.rest.repos.createRelease({...base, tag_name:tag, target_commitish:sha,
              name:`Shirokai Raids ${version}`, body, draft:true, prerelease:true, make_latest:'false'})).data;
            if (!release.prerelease) throw new Error('Release existente não é pre-release; não será alterada');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...base, release_id:release.id});
            for (const name of [`Shirokai-Raids-${version}-fabric-1.21.1.jar`, 'SHA256SUMS']) {
              const data = fs.readFileSync(`build/libs/${name}`);
              const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                if (existing.digest !== digest) throw new Error(`Asset ${name} diverge ou não tem integridade verificável; nada será sobrescrito`);
              } else {
                if (!release.draft) throw new Error('Pre-release publicada incompleta; intervenção manual necessária');
                const uploaded = (await github.rest.repos.uploadReleaseAsset({...base, release_id:release.id, name, data,
                  headers:{'content-type':'application/octet-stream','content-length':data.length}})).data;
                if (uploaded.digest !== digest) throw new Error(`Integridade do upload ${name} não confirmada`);
              }
            }
            if (release.draft) await github.rest.repos.updateRelease({...base, release_id:release.id, draft:false, prerelease:true, make_latest:'false'});
            core.notice(release.html_url);
