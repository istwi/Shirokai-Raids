plugins {
    id 'fabric-loom' version '1.10.5'
    id 'java'
}
group = 'com.shirokai.raids'
version = providers.gradleProperty('mod_version').get()
base { archivesName = 'Shirokai-Raids' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.impactdev.net/repository/development' }
    maven { url = 'https://artefacts.cobblemon.com/releases' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    modImplementation 'com.cobblemon:fabric:1.8.3+1.21.1'
    modCompileOnly 'net.luckperms:api:5.4'
    compileOnly('net.impactdev.impactor.api:economy:5.3.5') { exclude group: 'net.kyori', module: 'event-api' }
    testImplementation('net.impactdev.impactor.api:economy:5.3.5') { exclude group: 'net.kyori', module: 'event-api' }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
remapJar { archiveFileName = "Shirokai-Raids-${project.version}-fabric-1.21.1.jar" }

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// This fixture is never included in the distributable mod.
sourceSets {
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
processIntegrationResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.register('integrationJar', Jar) {
    from sourceSets.integration.output
    archiveClassifier = 'integration-unmapped'
    destinationDirectory = layout.buildDirectory.dir('integration')
}
tasks.register('remapIntegrationJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.integrationJar
    // Resolve inherited Minecraft methods through our main classes when remapping fixtures.
    classpath.from(sourceSets.main.output)
    inputFile = tasks.integrationJar.archiveFile
    archiveFileName = 'shirokai-raids-integration.jar'
    destinationDirectory = layout.buildDirectory.dir('integration')
}
build.dependsOn tasks.remapIntegrationJar

// Sources in this repository stop at 0.1.20. Package fixes over the complete 0.1.24
// distribution so recovery/authentication and private damage chat cannot regress.
configurations { hotfixTools }
dependencies { hotfixTools 'org.ow2.asm:asm-tree:9.8' }
remapJar { destinationDirectory = layout.buildDirectory.dir('intermediates') }
tasks.register('compileHotfixTools', JavaCompile) {
 source = files('tools/PatchLatestRaid.java')
 classpath = configurations.hotfixTools
 destinationDirectory = layout.buildDirectory.dir('hotfix-tools')
 options.release = 21
 javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.register('packageLatestRaidFix', Exec) {
 dependsOn tasks.remapJar, tasks.compileHotfixTools
 def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
 doFirst {
  commandLine 'python3','tools/package_latest_fix.py','--java',launcher.get().executablePath.asFile.absolutePath,
   '--tools-cp',files(tasks.compileHotfixTools.destinationDirectory,configurations.hotfixTools).asPath,
   '--candidate',tasks.remapJar.archiveFile.get().asFile.absolutePath,
   '--output',layout.buildDirectory.file("libs/Zorykai-Raids-${project.version}-fabric-1.21.1.jar").get().asFile.absolutePath,
   '--version',project.version.toString()
 }
}
build.dependsOn tasks.packageLatestRaidFix
